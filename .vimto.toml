# Use the same prebuilt kernel images as cilium/ebpf's CI.
kernel = "ghcr.io/cilium/ci-kernels:stable"
# Not a power of 2, to cover the CPU_MASK paths on kernels before v6.6.
smp = "cpus=3"
memory = "2G"
user = "root"
setup = [
  "mount -t cgroup2 -o nosuid,noexec,nodev cgroup2 /sys/fs/cgroup",
  "dmesg --clear",
]
teardown = [
  "dmesg --read-clear",
]
